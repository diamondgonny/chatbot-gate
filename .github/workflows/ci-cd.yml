# Note: Frontend is deployed via Vercel separately; this workflow targets backend only.

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'backend/docker-compose*.yml'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend/docker-compose*.yml'
  # Deploys an image that already passed the checks, for example a rollback.
  # Only the deploy job runs, and only from main.
  workflow_dispatch:
    inputs:
      image_ref:
        description: 'Image to deploy: ghcr.io/<owner>/<repo>/chatbot-gate-backend@sha256:<digest>'
        required: true
        type: string

# Pushes to main and manual runs deploy one at a time, in the order they were
# created. A running deployment is never cancelled; a run that is still
# waiting is replaced by a newer one.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'production' || format('ci-{0}', github.ref) }}
  cancel-in-progress: false

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run TypeScript type check
        working-directory: backend
        run: npx tsc --noEmit

      # Add ESLint when configured
      # - name: Run linter
      #   working-directory: backend
      #   run: npm run lint

  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    permissions:
      contents: read
      packages: write

    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      # The one reference that test, scan and deploy all use
      image-ref: ${{ steps.ref.outputs.image-ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/chatbot-gate-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-,format=short
            type=ref,event=branch

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image reference
        id: ref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not report a digest: '$DIGEST'" >&2
            exit 1
          fi
          IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY}/chatbot-gate-backend@${DIGEST}"
          echo "image-ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "Image reference: ${IMAGE_REF}"

  build-and-test:
    name: Build & Test Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and test GHCR image
        env:
          IMAGE_REF: ${{ needs.build-and-push.outputs.image-ref }}
        run: |
          echo "Pulling image: $IMAGE_REF"
          docker pull "$IMAGE_REF"

      - name: Check image size
        env:
          IMAGE_REF: ${{ needs.build-and-push.outputs.image-ref }}
        run: |
          IMAGE_BYTES=$(docker image inspect --format '{{.Size}}' "$IMAGE_REF")
          echo "Image size: $((IMAGE_BYTES / 1000000)) MB"

          # Fail if image is larger than 200MB
          if (( IMAGE_BYTES > 200000000 )); then
            echo "Error: Image size exceeds 200MB limit"
            exit 1
          fi

          echo "✅ Image size check passed"

      - name: Test container startup
        env:
          IMAGE_REF: ${{ needs.build-and-push.outputs.image-ref }}
        run: |
          echo "Using IMAGE_REF=$IMAGE_REF"

          # Create test .env file
          cat > backend/.env.test << EOF
          MONGO_INITDB_ROOT_USERNAME=test
          MONGO_INITDB_ROOT_PASSWORD=test
          MONGO_INITDB_DATABASE=test
          JWT_SECRET=test-secret-key-for-ci-only
          OPENAI_API_KEY=sk-test-fake-key
          OPENROUTER_API_KEY=sk-test-fake-router-key
          FRONTEND_URLS=http://localhost:3000
          IMAGE_REF=$IMAGE_REF
          EOF

          # Start services using CI compose configuration
          docker compose --profile db -f backend/docker-compose.yml -f backend/docker-compose.ci.yml --env-file backend/.env.test up -d mongodb backend

          # Wait for backend to be healthy
          echo "Waiting for backend to be healthy..."
          for i in {1..30}; do
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' chatbot-gate-backend-ci 2>/dev/null || echo "none")
            echo "Attempt $i/30... Health: $HEALTH"

            if [ "$HEALTH" = "healthy" ]; then
              echo "✅ Backend is healthy!"
              break
            fi

            sleep 2
          done

          if [ "$HEALTH" != "healthy" ]; then
            echo "❌ Backend failed to become healthy"
            docker compose --profile db -f backend/docker-compose.yml -f backend/docker-compose.ci.yml --env-file backend/.env.test logs backend
            exit 1
          fi

          # Test health endpoint. The deploy script relies on env and build.
          HEALTH_BODY=$(curl -fsS http://localhost:4000/health)
          echo "$HEALTH_BODY"
          echo "$HEALTH_BODY" | grep -q "\"env\":\"ci\"" || { echo "❌ /health does not report env"; exit 1; }
          echo "$HEALTH_BODY" | grep -q "\"build\":\"${GITHUB_SHA}\"" || { echo "❌ /health does not report this build"; exit 1; }

          # Cleanup
          docker compose --profile db -f backend/docker-compose.yml -f backend/docker-compose.ci.yml --env-file backend/.env.test down -v

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ needs.build-and-push.outputs.image-ref }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, build-and-test, security-scan]
    # A push deploys what its own run built, tested and scanned. A manual run
    # skips those jobs and deploys the given digest. Neither runs off main.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        needs.build-and-test.result == 'success' &&
        needs.security-scan.result == 'success'))
    environment:
      name: production
      url: https://chatbotgate.click

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # An automatic deployment goes ahead only if what this run built is
      # still what main holds for the backend paths. A newer backend commit
      # deploys from its own run; this one is skipped without failing.
      - name: Check that this build is still current
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual run: the content check does not apply"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESULT=0
          backend/scripts/ci-compare-content.sh "$GITHUB_SHA" origin main || RESULT=$?
          if [[ $RESULT -eq 0 ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ $RESULT -eq 10 ]]; then
            echo "::notice::Skipping deployment: main no longer holds the backend content of ${GITHUB_SHA}"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Could not compare this build with main" >&2
            exit 1
          fi

      - name: Resolve image reference
        id: image
        if: steps.gate.outputs.deploy == 'true'
        env:
          IMAGE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.image_ref || needs.build-and-push.outputs.image-ref }}
        run: |
          PATTERN="^ghcr\.io/${GITHUB_REPOSITORY}/chatbot-gate-backend@sha256:[0-9a-f]{64}$"
          if [[ ! "$IMAGE_REF" =~ $PATTERN ]]; then
            echo "❌ Not a digest reference of this repository's image: '$IMAGE_REF'" >&2
            exit 1
          fi
          echo "image-ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${IMAGE_REF}"

      - name: Connect to Tailscale
        if: steps.gate.outputs.deploy == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Tailscale network info
        if: steps.gate.outputs.deploy == 'true'
        run: |
          echo "=== Runner netcheck ==="
          tailscale netcheck

          echo "=== Runner IPs ==="
          tailscale ip -4
          tailscale ip -6

          echo "=== Ping verbose ==="
          tailscale ping --verbose --c 1 ${{ secrets.PRODUCTION_TAILSCALE_HOST }} || true

      - name: Wait for Tailscale & SSH port
        if: steps.gate.outputs.deploy == 'true'
        run: |
          HOST=${{ secrets.PRODUCTION_TAILSCALE_HOST }}
          for i in {1..18}; do
            echo "=== Attempt $i/18 ==="
            tailscale status --peers

            # Check Tailscale ping (allow DERP relay)
            PING_OUTPUT=$(tailscale ping --timeout=5s --c=1 "$HOST" 2>&1) || true
            echo "$PING_OUTPUT"

            if echo "$PING_OUTPUT" | grep -q "pong"; then
              # Log connection type
              if echo "$PING_OUTPUT" | grep -q "via DERP"; then
                echo "🟡 Connected via DERP relay"
              else
                echo "🟢 Direct connection established"
              fi

              # Check SSH port
              if nc -z "$HOST" 22; then
                echo "✅ Tailscale and SSH port ready"
                exit 0
              else
                echo "Tailscale OK but SSH port not ready yet..."
              fi
            else
              echo "Tailscale ping failed..."
            fi

            echo "Not ready yet, waiting 5s..."
            sleep 5
          done
          echo "❌ Tailscale or SSH port not reachable after 180s" >&2
          exit 1

      - name: Setup SSH key
        if: steps.gate.outputs.deploy == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config << EOF
          Host ${{ secrets.PRODUCTION_TAILSCALE_HOST }}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/deploy_key
          EOF

      - name: Deploy via SSH (Blue-Green)
        if: steps.gate.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_TAILSCALE_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          GHCR_DEPLOY_USER: ${{ secrets.GHCR_DEPLOY_USER }}
          IMAGE_REF: ${{ steps.image.outputs.image-ref }}
        run: |
          # Authenticate to GHCR (private package). The token travels on stdin.
          printf '%s' "$GHCR_DEPLOY_TOKEN" | \
            ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "docker login ghcr.io -u '${GHCR_DEPLOY_USER}' --password-stdin"

          # IMAGE_REF was checked against a strict pattern above, and the
          # script body below is sent as is, with nothing interpolated into it.
          # The deploy script exits 1 or 2 on failure; either fails this step.
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "IMAGE_REF='${IMAGE_REF}' GITHUB_REPO='${GITHUB_REPOSITORY}' bash -s" << 'DEPLOY_EOF'
            set -euo pipefail

            cd /home/user/lab/apps/chatbot-gate-backend
            export IMAGE_REF GITHUB_REPO

            echo "Deploying IMAGE_REF=$IMAGE_REF"

            # Blue-green deployment. It pulls the digest, switches, saves the
            # state and cleans up old containers and images under its own lock.
            ./scripts/deploy-blue-green.sh

            # Verify deployment against the saved state
            grep -qx "ACTIVE_IMAGE=${IMAGE_REF}" .deployment-state || { echo "❌ State file does not record ${IMAGE_REF}"; exit 1; }
            ACTIVE_ENV=$(sed -n 's/^ACTIVE_ENV=\(blue\|green\)$/\1/p' .deployment-state)
            echo "Active environment: ${ACTIVE_ENV}"
            docker exec "chatbot-gate-backend-${ACTIVE_ENV}" wget -qO- http://localhost:4000/health

            docker compose ps
          DEPLOY_EOF

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          rm -f ~/.ssh/config
